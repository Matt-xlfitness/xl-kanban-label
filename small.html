<!DOCTYPE html>
<!--
================================================================
  XL FITNESS — KANBAN SMALL LABEL  (86.5 × 28.5 mm)
  Source: Figma file VvOHTCmLwZqQwhln4q94zk (node 4:2)
  1049 × 346 px Figma canvas → 86.5 × 28.5 mm print, 1:1 scale
  Renders: image (left, white), name (top-right, gray), code (bottom-right, white)
  Same data contract as index.html — extra fields are ignored.
================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XL Kanban Label — Small</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:  #121826;
    --black: #000;
    --white: #fff;
    --gray:  #959595;
    --page-bg: #d6d6d6;
    --print-w: 86.5mm;
    --print-h: 28.5mm;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Lexend', 'Helvetica Neue', Arial, sans-serif;
    background: var(--page-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 60px;
  }

  /* ---------- Controls ---------- */
  .controls {
    margin-bottom: 24px;
    background: var(--white);
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 14px;
    font-family: 'Lexend', sans-serif;
    font-weight: 700;
    flex-wrap: wrap;
  }
  .controls input {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 180px;
    font-family: inherit;
    font-weight: 700;
    text-transform: uppercase;
  }
  .controls button {
    padding: 7px 16px;
    background: var(--navy);
    color: var(--white);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
  }
  .controls .print-btn { background: #2a7a3a; }
  .hint { font-size: 12px; color: #555; font-weight: 500; }

  /* ---------- Stage = exact print size ---------- */
  .stage {
    width: var(--print-w);
    height: var(--print-h);
    position: relative;
    container-type: size;
    background: var(--white);
  }

  /* ---------- Label outer (Figma 1049 × 346 px → percentages) ---------- */
  /* White bg, 25px black border, 40px rounded corners */
  .label {
    position: absolute;
    inset: 0;
    background: var(--white);
    border-radius: 3.81cqw;            /* 40/1049 */
    outline: 2.383cqw solid var(--black);  /* 25/1049 */
    outline-offset: -2.383cqw;
  }
  .label > * { position: absolute; }

  /* ---------- Image rect (white bg, 1px black border, 13px rounded) ---------- */
  /* Figma: 318 × 290 at (32, 30) on 1049 × 346 outer */
  .image-rect {
    left:    3.05%;   /*  32/1049 */
    top:     8.67%;   /*  30/346  */
    width:  30.31%;   /* 318/1049 */
    height: 83.82%;   /* 290/346  */
    background: var(--white);
    border: 0.0953cqw solid var(--black);  /* 1/1049 */
    border-radius: 1.24cqw;                /* 13/1049 */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image-rect img {
    width: 100%;
    height: 100%;
    object-fit: cover;           /* fill the rect like the Figma <IMAGE> placeholder does */
  }
  .image-rect .placeholder {
    font-weight: 800;
    font-size: 6.10cqw;       /* 64/1049 — Figma <IMAGE> placeholder */
    color: var(--black);
  }

  /* ---------- Name rect (dynamic accent bg, white text, 1px black border, 13px rounded) ---------- */
  /* Figma: 664 × 175 at (360, 24) — fill #959595 default; per-product accent overrides */
  .name-area {
    left:   34.32%;   /* 360/1049 */
    top:     6.94%;   /*  24/346  */
    width:  63.30%;   /* 664/1049 */
    height: 50.58%;   /* 175/346  */
    background: var(--accent, var(--gray));
    color: var(--white);
    border: 0.0953cqw solid var(--black);  /* 1/1049 */
    border-radius: 1.24cqw;                /* 13/1049 */
    font-weight: 800;
    font-size: 3.81cqw;       /* 40/1049 — Figma NAME size */
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 0.8cqw;
    overflow: hidden;
    word-wrap: break-word;
  }

  /* ---------- Code rect (white bg, black text, 1px black border, 15px rounded) ---------- */
  /* Figma: 660 × 108 at (360, 209) */
  .code-rect {
    left:   34.32%;   /* 360/1049 */
    top:    60.40%;   /* 209/346  */
    width:  62.92%;   /* 660/1049 */
    height: 31.21%;   /* 108/346  */
    background: var(--white);
    color: var(--black);
    border: 0.0953cqw solid var(--black);  /* 1/1049 */
    border-radius: 1.43cqw;                /* 15/1049 */
    font-weight: 800;
    font-size: 7.15cqw;       /* 75/1049 — Figma CODE size */
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    padding: 0 0.5cqw;
    white-space: nowrap;
    letter-spacing: 0.1cqw;
  }

  /* ---------- Print ---------- */
  html, body, .stage, .label, .label * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  @media print {
    @page {
      size: 86.5mm 28.5mm;
      margin: 0;
    }
    body {
      background: white;
      padding: 0;
      margin: 0;
      display: block;
    }
    .controls { display: none !important; }
    .stage {
      width: 86.5mm;
      height: 28.5mm;
      page-break-after: avoid;
    }
    /* Re-assert print colours so fills aren't stripped */
    .label { background-color: var(--white) !important; outline-color: var(--black) !important; }
    .image-rect, .code-rect { background-color: var(--white) !important; }
    .name-area { background-color: var(--accent, var(--gray)) !important; color: var(--white) !important; }
    .code-rect { color: var(--black) !important; }
    .image-rect, .name-area, .code-rect { border-color: var(--black) !important; }
  }
</style>
</head>
<body>

<div class="controls">
  <label for="code">XL-Code:</label>
  <input id="code" type="text" value="SUPPS-0254" />
  <button id="load">Load</button>
  <button id="print" class="print-btn" type="button">Print 86.5×28.5mm</button>
  <span class="hint">In the print dialog, choose paper size <strong>86.5 × 28.5 mm</strong> (custom), 100% scale, background graphics ON.</span>
</div>

<div class="stage">
  <div class="label" id="label">
    <div class="image-rect" id="productImage">
      <span class="placeholder">&lt;IMAGE&gt;</span>
    </div>
    <div class="name-area" id="description"></div>
    <div class="code-rect" id="xlCode"></div>
  </div>
</div>

<script>
  /* ---------- Local samples (testing) ---------- */
  const PRODUCTS = {
    "SUPPS-0254": {
      code: "SUPPS-0254",
      description: "CBUM Thavage PUMP RTD 355ml Juicy Pumps",
      image: "",
      color: "#121826"
    },
    "SUPPS-0356": {
      code: "SUPPS-0356",
      description: "Gatorade NO SUGAR - Berry",
      image: "",
      color: "#121826"
    }
  };

  /* ---------- Data resolution: ?data= → ?code= → local PRODUCTS ---------- */
  const API_ENDPOINT = "";

  function decodeDataParam(b64) {
    try {
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch (e) {
      console.error("Failed to decode ?data= param:", e);
      return null;
    }
  }

  async function loadProduct(code) {
    const dataParam = new URLSearchParams(window.location.search).get("data");
    if (dataParam) {
      const decoded = decodeDataParam(dataParam);
      if (decoded) return decoded;
    }
    if (API_ENDPOINT && code) {
      try {
        const res = await fetch(API_ENDPOINT + encodeURIComponent(code));
        if (res.ok) return await res.json();
      } catch (e) {
        console.error("API fetch failed:", e);
      }
    }
    return PRODUCTS[code] || null;
  }

  async function render(code) {
    const p = await loadProduct(code);
    if (!p) {
      alert("No product found for code: " + code);
      return;
    }

    // Apply per-product accent (from category, per Manus brief) to the name rect
    const accent = (p.color && /^#[0-9a-fA-F]{3,8}$/.test(p.color))
      ? p.color : "#959595";
    document.getElementById("label").style.setProperty("--accent", accent);

    document.getElementById("xlCode").textContent      = p.code || "";
    document.getElementById("description").textContent = p.description || "";

    const img = document.getElementById("productImage");
    img.innerHTML = p.image
      ? `<img src="${p.image}" alt="${p.description || ''}" />`
      : `<span class="placeholder">&lt;IMAGE&gt;</span>`;
  }

  /* ---------- Auto-fit text to its container ---------- */
  function fitText(el, minPx = 6) {
    if (!el || !el.textContent.trim()) return;
    el.style.fontSize = "";
    let guard = 80;
    while (
      (el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight) &&
      guard-- > 0
    ) {
      const cs = window.getComputedStyle(el);
      const current = parseFloat(cs.fontSize);
      const next = Math.max(minPx, current - 0.5);
      if (next === current) break;
      el.style.fontSize = next + "px";
    }
  }
  function fitAll() {
    document.querySelectorAll(".name-area, .code-rect")
      .forEach(el => fitText(el));
  }

  document.getElementById("load").addEventListener("click", async () => {
    const code = document.getElementById("code").value.trim().toUpperCase();
    await render(code);
    requestAnimationFrame(fitAll);
  });
  document.getElementById("print").addEventListener("click", () => {
    fitAll();
    window.print();
  });

  const params = new URLSearchParams(window.location.search);
  const initial = (params.get("code") || "SUPPS-0254").toUpperCase();
  document.getElementById("code").value = initial;
  render(initial).then(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitAll);
    } else {
      requestAnimationFrame(fitAll);
    }
  });

  window.addEventListener("resize", () => requestAnimationFrame(fitAll));
  window.addEventListener("beforeprint", fitAll);
</script>

</body>
</html>
