<!DOCTYPE html>
<!--
================================================================
  XL FITNESS — KANBAN PRINT SHEET (multi-size, multi-card per A4)
  Renders N labels at one or more sizes (large / medium / small),
  packed onto A4 portrait pages, in one print job.

  HOW TO PASS DATA
    ?data=<base64 JSON ARRAY of products>     (preferred)
    ?codes=SUPPS-0254,SUPPS-0356               (testing — local samples)

  HOW TO PASS SIZES
    ?sizes=large                  (default if omitted — backwards compat)
    ?sizes=medium
    ?sizes=small
    ?sizes=large,medium,small     (multi-size — grouped by size)
    ?sizes=all                    (alias for large,medium,small)

    Singular ?size= and 3-char codes (lrg/med/sml) also accepted.

  PER-PAGE PACKING ON A4 PORTRAIT
    Large  127 × 127 mm →  2 cards / A4
    Medium 125 ×  52 mm →  5 cards / A4
    Small  86.5 × 28.5 mm → 20 cards / A4 (2 cols × 10 rows)
================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XL Kanban Sheet — Print Multi-Size</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --navy:  #121826;
    --black: #000;
    --white: #fff;
    --gray:  #959595;
    --page-bg: #d6d6d6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    font-family: 'Lexend', 'Helvetica Neue', Arial, sans-serif;
    background: var(--page-bg);
    padding: 24px 16px 60px;
  }

  /* ---------- Controls (screen only) ---------- */
  .controls {
    max-width: 210mm;
    margin: 0 auto 20px;
    background: var(--white);
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    flex-wrap: wrap;
  }
  .controls .info { color: #444; font-weight: 500; }
  .controls button {
    padding: 8px 16px;
    background: var(--navy);
    color: var(--white);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
  }
  .controls .print-btn { background: #2a7a3a; }

  /* ---------- Empty state ---------- */
  .empty-state {
    max-width: 600px;
    margin: 60px auto;
    padding: 28px;
    background: white;
    border: 2px dashed #aaa;
    border-radius: 12px;
    color: #555;
    line-height: 1.5;
  }
  .empty-state code {
    background: #eee;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* ---------- A4 page wrapper ---------- */
  .sheet { display: flex; flex-direction: column; align-items: center; gap: 12mm; }

  .page {
    width: 210mm;
    height: 297mm;
    background: var(--white);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    /* No display/flex rules here — each .page--size declares its own grid */
  }
  /* Large + Medium: block layout with margin:auto on the stage — the most
     universally supported horizontal-centering pattern. Print engines
     respect this even when CSS Grid centering misbehaves. */
  .page--large,
  .page--medium {
    display: block;
    text-align: center;          /* belt-and-suspenders */
    padding: 15mm 0;             /* explicit boundary offset top/bot */
  }
  .page--large .stage,
  .page--medium .stage {
    display: block;
    margin-left: auto;
    margin-right: auto;          /* horizontal centering on a block element */
  }
  .page--large .stage + .stage  { margin-top: 12mm; }
  .page--medium .stage + .stage { margin-top: 2mm; }

  /* Small still uses a 2-col grid — it was working, no need to change. */
  .page--small {
    display: grid;
    grid-template-columns: repeat(2, 86.5mm);
    justify-content: center;
    align-content: center;
    gap: 2mm 4mm;
    padding: 0;
  }

  /* Stage = exact print size of one card */
  .stage {
    position: relative;
    container-type: size;
    background: var(--white);
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* ===========================================================
     ===================== LARGE  127 × 127 ====================
     =========================================================== */
  .page--large .stage { width: 127mm; height: 127mm; }

  .page--large .label {
    position: absolute; inset: 0;
    background: var(--white);
    border-radius: 3.61cqw;
    outline: 1.92cqw solid var(--black);
    outline-offset: -1.92cqw;
  }
  .page--large .label > * { position: absolute; }

  .page--large .code-bar,
  .page--large .name-bar {
    background: var(--navy);
    border-radius: 1.20cqw;
    color: var(--white);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; line-height: 1; overflow: hidden;
    padding: 0 1.5cqw;
    left: 2.41%; width: 95.07%; height: 9.44%;
    white-space: nowrap;
  }
  .page--large .code-bar { top: 2.31%; font-size: 6.7cqw; letter-spacing: 0.12cqw; }
  .page--large .name-bar { top: 13.39%; font-size: 4.8cqw; letter-spacing: 0.06cqw; }

  .page--large .cell {
    height: 4.94%;
    border: 0.36cqw solid var(--black);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; line-height: 1; overflow: hidden;
    padding: 0 0.7cqw;
    font-size: 2.65cqw;
    white-space: nowrap;
  }
  .page--large .cell.is-empty { display: none; }
  .page--large .cell-label { width: 21.30%; background: var(--navy); color: var(--white); left: 2.29%;  letter-spacing: 0.06cqw; }
  .page--large .cell-value { width: 26.47%; background: var(--white); color: var(--black); left: 23.59%; font-weight: 700; }

  .page--large .cell-big {
    height: 9.66%;
    border: 0.36cqw solid var(--black);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; line-height: 1; overflow: hidden;
    padding: 0 0.7cqw;
    white-space: nowrap;
  }
  .page--large .cell-big-label { width: 21.30%; left: 2.29%;  background: var(--navy); color: var(--white); font-size: 2.65cqw; }
  .page--large .cell-big-value { width: 26.47%; left: 23.59%; background: var(--white); color: var(--black); font-size: 4.6cqw; font-weight: 800; }

  .page--large .image-rect {
    left: 51.50%; top: 24.48%; width: 44.65%; height: 40.72%;
    background: var(--white); border: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .page--large .image-rect img { max-width: 96%; max-height: 96%; object-fit: contain; }
  .page--large .image-rect .placeholder { font-weight: 800; font-size: 3.4cqw; color: var(--black); }

  .page--large .qr-rect {
    left: 57.28%; top: 66.08%; width: 33.09%; height: 30.19%;
    background: var(--white); border: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    padding: 1cqw;
  }
  .page--large .qr-rect canvas, .page--large .qr-rect img {
    width: 100% !important; height: 100% !important; object-fit: contain;
  }

  /* ===========================================================
     ===================== MEDIUM  125 × 52 ====================
     ===========================================================
     Source: Figma TBHCw5NW0FCfA1eNJQGz5y · 1049 × 436 px → 125 × 52 mm
  */
  .page--medium .stage { width: 125mm; height: 52mm; }

  .page--medium .label {
    position: absolute; inset: 0;
    background: var(--navy);
    outline: 1.525cqw solid var(--black);
    outline-offset: -1.525cqw;
  }
  .page--medium .label > * { position: absolute; }

  .page--medium .image-rect {
    left:    14.39%; top:  3.67%; width: 35.27%; height: 92.66%;
    background: var(--white);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .page--medium .image-rect img { max-width: 96%; max-height: 96%; object-fit: contain; }
  .page--medium .image-rect .placeholder { font-weight: 800; font-size: 7.15cqw; color: var(--black); }

  .page--medium .name-area {
    left:    50.91%; top: 3.67%; width: 35.27%; height: 49.77%;
    color: var(--white);
    font-weight: 800; font-size: 3.81cqw; line-height: 1.1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 0.5cqw; overflow: hidden; word-wrap: break-word;
  }

  .page--medium .code-rect {
    left:    50.91%; top: 53.44%; width: 35.27%; height: 42.89%;
    background: var(--white); color: var(--black);
    font-weight: 800; font-size: 7.15cqw; line-height: 1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    overflow: hidden; padding: 0 0.5cqw;
    white-space: nowrap; letter-spacing: 0.1cqw;
  }

  /* ===========================================================
     ===================== SMALL  86.5 × 28.5 ==================
     ===========================================================
     Source: Figma VvOHTCmLwZqQwhln4q94zk · 1049 × 346 px → 86.5 × 28.5 mm
  */
  .page--small .stage { width: 86.5mm; height: 28.5mm; }

  .page--small .label {
    position: absolute; inset: 0;
    background: var(--white);
    border-radius: 3.81cqw;
    outline: 2.383cqw solid var(--black);
    outline-offset: -2.383cqw;
  }
  .page--small .label > * { position: absolute; }

  .page--small .image-rect {
    left:    3.05%; top: 8.67%; width: 30.31%; height: 83.82%;
    background: var(--white);
    border: 0.0953cqw solid var(--black);
    border-radius: 1.24cqw;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .page--small .image-rect img { width: 100%; height: 100%; object-fit: cover; }
  .page--small .image-rect .placeholder { font-weight: 800; font-size: 6.10cqw; color: var(--black); }

  .page--small .name-area {
    left:    34.32%; top: 6.94%; width: 63.30%; height: 50.58%;
    background: var(--accent, var(--gray)); color: var(--white);
    border: 0.0953cqw solid var(--black);
    border-radius: 1.24cqw;
    font-weight: 800; font-size: 3.81cqw; line-height: 1.1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 0.8cqw; overflow: hidden; word-wrap: break-word;
  }

  .page--small .code-rect {
    left:    34.32%; top: 60.40%; width: 62.92%; height: 31.21%;
    background: var(--white); color: var(--black);
    border: 0.0953cqw solid var(--black);
    border-radius: 1.43cqw;
    font-weight: 800; font-size: 7.15cqw; line-height: 1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    overflow: hidden; padding: 0 0.5cqw;
    white-space: nowrap; letter-spacing: 0.1cqw;
  }

  /* ---------- Print ---------- */
  html, body, .stage, .label, .label * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  @media print {
    /* 10mm @page margin keeps cards clear of the printer's unprintable edge zone.
       Printable area: 210−20 = 190mm wide × 297−20 = 277mm tall. */
    @page { size: A4; margin: 10mm; }
    body { background: white; padding: 0; margin: 0; }
    .controls, .empty-state { display: none !important; }

    .sheet { gap: 0; }

    .page {
      box-shadow: none;
      page-break-after: always;
      break-after: page;
      /* Match the printable area; padding handled by @page margin */
      width: 190mm;
      height: 277mm;
      padding: 0;
    }
    .page:last-child {
      page-break-after: auto !important;
      break-after: auto !important;
    }
    /* Print-mode layout matches screen exactly so what you see is what prints. */

    /* Re-assert per-size colours so they aren't stripped */
    .page--large .code-bar,
    .page--large .name-bar,
    .page--large .cell-label,
    .page--large .cell-big-label {
      background-color: var(--navy) !important; color: var(--white) !important;
    }
    .page--large .label { outline-color: var(--black) !important; }
    .page--large .cell, .page--large .cell-big { border-color: var(--black) !important; }

    .page--medium .label { background-color: var(--navy) !important; outline-color: var(--black) !important; }
    .page--medium .image-rect, .page--medium .code-rect { background-color: var(--white) !important; }
    .page--medium .name-area { color: var(--white) !important; }
    .page--medium .code-rect { color: var(--black) !important; }

    .page--small .label { background-color: var(--white) !important; outline-color: var(--black) !important; }
    .page--small .image-rect, .page--small .code-rect { background-color: var(--white) !important; }
    .page--small .name-area { background-color: var(--accent, var(--gray)) !important; color: var(--white) !important; }
    .page--small .code-rect { color: var(--black) !important; }
    .page--small .image-rect, .page--small .name-area, .page--small .code-rect { border-color: var(--black) !important; }
  }
</style>
</head>
<body>

<div class="controls">
  <button id="print" class="print-btn" type="button">Print Sheet</button>
  <span class="info" id="status">Loading…</span>
  <span class="info">Print dialog: paper <strong>A4</strong>, margins <strong>None</strong>, scale <strong>100%</strong>, background graphics <strong>ON</strong>.</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
  /* ---------- Local samples (only used when ?codes=… is passed) ---------- */
  const SAMPLE_PRODUCTS = {
    "SUPPS-0356": {
      code: "SUPPS-0356",
      description: "Gatorade NO SUGAR - Berry",
      rows: {
        a3:  { label: "TYPE", value: "Drinks, Hydration" },
        a4:  { label: "VARIANT", value: "No Sugar - Berry" },
        a5:  { label: "BRAND", value: "Gatorade" },
        a6:  { label: "", value: "" }, a7:  { label: "", value: "" },
        a8:  { label: "", value: "" }, a9:  { label: "", value: "" },
        a10: { label: "SUPPLIER", value: "FitnessVending" },
        a11: { label: "XL PART ID", value: "SUPPS-0356" },
        a12: { label: "SUPPLIER SKU", value: "2875839578208" },
        a1:  { label: "Q to Order", value: "1" },
        a2:  { label: "Box Size", value: "12" }
      },
      image: "", qrPayload: "https://xlfitness.com.au/parts/SUPPS-0356", color: "#121826"
    },
    "SUPPS-0254": {
      code: "SUPPS-0254",
      description: "CBUM Thavage PUMP RTD 355ml Juicy Pumps",
      rows: {
        a3:  { label: "TYPE", value: "Drinks, Energy" },
        a4:  { label: "VARIANT", value: "Juicy Pumps" },
        a5:  { label: "BRAND", value: "CBUM Thavage" },
        a6:  { label: "", value: "" }, a7:  { label: "", value: "" },
        a8:  { label: "", value: "" }, a9:  { label: "", value: "" },
        a10: { label: "SUPPLIER", value: "FitnessVending" },
        a11: { label: "XL PART ID", value: "SUPPS-0254" },
        a12: { label: "SUPPLIER SKU", value: "3481611960416" },
        a1:  { label: "Q to Order", value: "1" },
        a2:  { label: "Box Size", value: "12" }
      },
      image: "", qrPayload: "https://xlfitness.com.au/parts/SUPPS-0254", color: "#121826"
    }
  };

  /* ---------- Slot positions (LARGE only — % of stage height) ---------- */
  const SPEC_TOPS = {
    a3: 24.04, a4: 28.98, a5: 33.92, a6: 38.86, a7: 43.80,
    a8: 48.74, a9: 53.68, a10: 58.62, a11: 63.56, a12: 68.50
  };
  const BIG_TOPS = { a1: 75.41, a2: 84.74 };

  /* ===========================================================
     ===================== Card builders =======================
     =========================================================== */

  /* ---------- LARGE card ---------- */
  function buildLargeCard(product) {
    const stage = document.createElement('div');
    stage.className = 'stage';

    const label = document.createElement('div');
    label.className = 'label';
    const accent = (product.color && /^#[0-9a-fA-F]{3,8}$/.test(product.color))
      ? product.color : "#121826";
    label.style.setProperty('--navy', accent);

    const codeBar = document.createElement('div');
    codeBar.className = 'code-bar';
    codeBar.textContent = product.code || "";
    label.appendChild(codeBar);

    const nameBar = document.createElement('div');
    nameBar.className = 'name-bar';
    nameBar.textContent = product.description || "";
    label.appendChild(nameBar);

    Object.entries(SPEC_TOPS).forEach(([key, top]) => {
      const row = (product.rows && product.rows[key]) || { label: '', value: '' };
      const isEmpty = !row.label && !row.value;

      const lblCell = document.createElement('div');
      lblCell.className = 'cell cell-label' + (isEmpty ? ' is-empty' : '');
      lblCell.style.top = top + '%';
      lblCell.textContent = row.label || '';
      label.appendChild(lblCell);

      const valCell = document.createElement('div');
      valCell.className = 'cell cell-value' + (isEmpty ? ' is-empty' : '');
      valCell.style.top = top + '%';
      valCell.textContent = row.value || '';
      label.appendChild(valCell);
    });

    Object.entries(BIG_TOPS).forEach(([key, top]) => {
      const row = (product.rows && product.rows[key]) || { label: '', value: '' };

      const lblCell = document.createElement('div');
      lblCell.className = 'cell-big cell-big-label';
      lblCell.style.top = top + '%';
      lblCell.textContent = row.label || '';
      label.appendChild(lblCell);

      const valCell = document.createElement('div');
      valCell.className = 'cell-big cell-big-value';
      valCell.style.top = top + '%';
      valCell.textContent = row.value || '';
      label.appendChild(valCell);
    });

    const imgRect = document.createElement('div');
    imgRect.className = 'image-rect';
    if (product.image) {
      const img = document.createElement('img');
      img.src = product.image;
      img.alt = product.description || '';
      imgRect.appendChild(img);
    } else {
      const ph = document.createElement('span');
      ph.className = 'placeholder';
      ph.textContent = '<IMAGE>';
      imgRect.appendChild(ph);
    }
    label.appendChild(imgRect);

    const qrRect = document.createElement('div');
    qrRect.className = 'qr-rect';
    label.appendChild(qrRect);

    stage.appendChild(label);

    return { stage, qrRect, qrText: product.qrPayload || product.code || '' };
  }

  /* ---------- MEDIUM card (image + name + code, no QR) ---------- */
  function buildMediumCard(product) {
    const stage = document.createElement('div');
    stage.className = 'stage';

    const label = document.createElement('div');
    label.className = 'label';
    const accent = (product.color && /^#[0-9a-fA-F]{3,8}$/.test(product.color))
      ? product.color : "#121826";
    label.style.setProperty('--navy', accent);

    const imgRect = document.createElement('div');
    imgRect.className = 'image-rect';
    if (product.image) {
      const img = document.createElement('img');
      img.src = product.image;
      img.alt = product.description || '';
      imgRect.appendChild(img);
    } else {
      const ph = document.createElement('span');
      ph.className = 'placeholder';
      ph.textContent = '<IMAGE>';
      imgRect.appendChild(ph);
    }
    label.appendChild(imgRect);

    const nameArea = document.createElement('div');
    nameArea.className = 'name-area';
    nameArea.textContent = product.description || '';
    label.appendChild(nameArea);

    const codeRect = document.createElement('div');
    codeRect.className = 'code-rect';
    codeRect.textContent = product.code || '';
    label.appendChild(codeRect);

    stage.appendChild(label);
    return { stage };
  }

  /* ---------- SMALL card (white outer, accent-coloured name rect, no QR) ---------- */
  function buildSmallCard(product) {
    const stage = document.createElement('div');
    stage.className = 'stage';

    // Small label outer is white. Per-product accent goes on the name rect only.
    const label = document.createElement('div');
    label.className = 'label';
    const accent = (product.color && /^#[0-9a-fA-F]{3,8}$/.test(product.color))
      ? product.color : "#959595";
    label.style.setProperty('--accent', accent);

    const imgRect = document.createElement('div');
    imgRect.className = 'image-rect';
    if (product.image) {
      const img = document.createElement('img');
      img.src = product.image;
      img.alt = product.description || '';
      imgRect.appendChild(img);
    } else {
      const ph = document.createElement('span');
      ph.className = 'placeholder';
      ph.textContent = '<IMAGE>';
      imgRect.appendChild(ph);
    }
    label.appendChild(imgRect);

    const nameArea = document.createElement('div');
    nameArea.className = 'name-area';
    nameArea.textContent = product.description || '';
    label.appendChild(nameArea);

    const codeRect = document.createElement('div');
    codeRect.className = 'code-rect';
    codeRect.textContent = product.code || '';
    label.appendChild(codeRect);

    stage.appendChild(label);
    return { stage };
  }

  /* ---------- Per-size config ----------
     perPage tuned for A4 printable area (190 × 277 mm with @page margin 10mm):
     Large  2 cards (2 × 127 + 12mm gap = 266mm, fits 277mm)
     Medium 5 cards (5 × 52  +  8mm gap = 268mm, fits 277mm)
     Small  18 cards = 9 rows × 2 cols (9 × 28.5 + 16mm row gaps = 272.5mm, fits 277mm)
  */
  const SIZE_CONFIG = {
    large:  { perPage: 2,  build: buildLargeCard  },
    medium: { perPage: 5,  build: buildMediumCard },
    small:  { perPage: 18, build: buildSmallCard  }
  };

  /* ---------- Auto-fit text in each cell ---------- */
  function fitText(el, minPx = 6) {
    if (!el || !el.textContent.trim()) return;
    el.style.fontSize = '';
    let guard = 60;
    while (
      (el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight) &&
      guard-- > 0
    ) {
      const cs = window.getComputedStyle(el);
      const current = parseFloat(cs.fontSize);
      const next = Math.max(minPx, current - 0.5);
      if (next === current) break;
      el.style.fontSize = next + 'px';
    }
  }
  function fitAll() {
    document.querySelectorAll('.code-bar, .name-bar, .cell, .cell-big, .name-area, .code-rect')
      .forEach(el => fitText(el));
  }

  /* ---------- Decode product list from URL ---------- */
  function loadProducts() {
    const params = new URLSearchParams(window.location.search);

    const dataParam = params.get('data');
    if (dataParam) {
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
        return Array.isArray(decoded) ? decoded : [decoded];
      } catch (e) {
        console.error('Invalid ?data= param:', e);
        return [];
      }
    }

    const codesParam = params.get('codes');
    if (codesParam) {
      return codesParam.split(',')
        .map(c => SAMPLE_PRODUCTS[c.trim()])
        .filter(Boolean);
    }

    return null; // signal "no input"
  }

  /* ---------- Decode sizes from URL ----------
     Accepts:
       ?sizes=large,medium,small   (preferred — per the Manus brief)
       ?sizes=all                  (alias for all 3)
       ?size=medium                (singular, also accepted)
       Abbreviations lrg/med/sml   (also accepted)
     Default (omitted) = ['large']
  */
  function loadSizes() {
    const params = new URLSearchParams(window.location.search);
    const raw = (params.get('sizes') || params.get('size') || 'large').toLowerCase().trim();

    if (raw === 'all') return ['large', 'medium', 'small'];

    const ALIAS = { lrg: 'large', med: 'medium', sml: 'small' };
    const sizes = raw.split(',')
      .map(s => s.trim())
      .map(s => ALIAS[s] || s)
      .filter(s => s in SIZE_CONFIG);

    return sizes.length > 0 ? sizes : ['large'];
  }

  /* ---------- Normalise a per-item sizes array (lives inside the JSON product) ----------
     Accepts: ["large","medium"], ["sml"], ["all"], etc.
     Returns null if the field is missing/empty/all-invalid (caller should fall back to global).
  */
  function normalisePerItemSizes(rawSizes) {
    if (!Array.isArray(rawSizes) || rawSizes.length === 0) return null;
    const ALIAS = { lrg: 'large', med: 'medium', sml: 'small' };
    const expanded = [];
    for (const s of rawSizes) {
      const lower = String(s).toLowerCase().trim();
      if (lower === 'all') {
        expanded.push('large', 'medium', 'small');
      } else {
        expanded.push(ALIAS[lower] || lower);
      }
    }
    const valid = expanded.filter(s => s in SIZE_CONFIG);
    return valid.length > 0 ? [...new Set(valid)] : null;
  }

  /* ---------- Effective sizes for one product ----------
     Per-item product.sizes wins. If absent/empty/invalid, fall back to global.
  */
  function effectiveSizes(product, globalSizes) {
    return normalisePerItemSizes(product.sizes) || globalSizes;
  }

  /* ---------- Render the sheet ---------- */
  function renderSheet() {
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = '';

    const products = loadProducts();

    if (products === null) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <h3 style="margin-bottom:8px">No products to print</h3>
        <p>Pass products to this page in the URL:</p>
        <p style="margin-top:8px"><code>?data=&lt;base64 JSON array&gt;&amp;sizes=large,medium,small</code> — preferred, multi-size</p>
        <p style="margin-top:4px"><code>?codes=SUPPS-0254,SUPPS-0356&amp;sizes=all</code> — testing, all sizes</p>
        <p style="margin-top:14px"><a href="?codes=SUPPS-0254,SUPPS-0356&sizes=all">→ Try the sample (2 cards × 3 sizes)</a></p>
      `;
      sheet.appendChild(empty);
      document.getElementById('status').textContent = '0 cards loaded';
      return;
    }

    if (products.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<h3>No valid products in URL</h3><p>Check the <code>?data=</code> or <code>?codes=</code> parameter.</p>`;
      sheet.appendChild(empty);
      document.getElementById('status').textContent = '0 cards loaded';
      return;
    }

    const globalSizes = loadSizes();
    const qrJobs = [];
    let totalPages = 0;
    let totalCards = 0;
    const pageBreakdown = [];

    /* Iterate over all sizes in fixed order so the printed sheet always
       groups Large → Medium → Small, regardless of per-item overrides. */
    const ALL_SIZES = ['large', 'medium', 'small'];

    ALL_SIZES.forEach(size => {
      const productsAtSize = products.filter(p =>
        effectiveSizes(p, globalSizes).includes(size)
      );
      if (productsAtSize.length === 0) return;

      const cfg = SIZE_CONFIG[size];

      for (let i = 0; i < productsAtSize.length; i += cfg.perPage) {
        const pageItems = productsAtSize.slice(i, i + cfg.perPage);
        const page = document.createElement('div');
        page.className = `page page--${size}`;

        pageItems.forEach(p => {
          const result = cfg.build(p);
          page.appendChild(result.stage);
          if (result.qrRect) {
            qrJobs.push({ qrRect: result.qrRect, qrText: result.qrText });
          }
        });

        sheet.appendChild(page);
        totalPages++;
      }

      const sizePages = Math.ceil(productsAtSize.length / cfg.perPage);
      pageBreakdown.push(`${productsAtSize.length} ${size} on ${sizePages} pg`);
      totalCards += productsAtSize.length;
    });

    qrJobs.forEach(({ qrRect, qrText }) => {
      qrRect.innerHTML = '';
      new QRCode(qrRect, {
        text: qrText, width: 512, height: 512,
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    document.getElementById('status').textContent =
      totalCards === 0
        ? `${products.length} item${products.length === 1 ? '' : 's'} loaded — no sizes selected for any item`
        : `${products.length} item${products.length === 1 ? '' : 's'} → ${totalCards} card${totalCards === 1 ? '' : 's'} on ${totalPages} A4 page${totalPages === 1 ? '' : 's'} (${pageBreakdown.join(' · ')})`;

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitAll);
    } else {
      requestAnimationFrame(fitAll);
    }
  }

  document.getElementById('print').addEventListener('click', () => {
    fitAll();
    window.print();
  });
  window.addEventListener('resize', () => requestAnimationFrame(fitAll));
  window.addEventListener('beforeprint', fitAll);

  renderSheet();
</script>

</body>
</html>
